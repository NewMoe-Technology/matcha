name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: Cafe.Matcha.sln

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup NuGet.exe for use with actions
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild $env:Solution_Name /t:Restore,Build /p:Configuration=$env:Configuration
        env:
          Configuration: ${{ matrix.configuration }}

      - name: Find release package and version
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path "bin" -Filter "Cafe.Matcha-*-Release.zip" -File)

          if ($packages.Count -ne 1) {
            throw "Expected exactly one Cafe.Matcha-*-Release.zip in bin, found $($packages.Count)."
          }

          $fileName = $packages[0].Name

          if ($fileName -notmatch '^Cafe\.Matcha-(?<version>\d+(?:\.\d+)+)-Release\.zip$') {
            throw "Cannot extract version from package name: $fileName"
          }

          $version = $Matches.version
          $filePath = "bin/$fileName"

          "version=$version" >> $env:GITHUB_OUTPUT
          "file=$filePath" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $version"
          Write-Host "Release package: $filePath"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bundle
          path: ${{ steps.package.outputs.file }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.package.outputs.version }}
          name: ${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ steps.package.outputs.file }}
          token: ${{ github.token }}
